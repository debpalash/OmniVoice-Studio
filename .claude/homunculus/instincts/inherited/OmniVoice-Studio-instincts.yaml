# OmniVoice Studio Workflow Add New Engine Backend

## Action

Follow the add-new-engine-backend workflow:
1. Create new backend/engines/{engine_name}/ directory with __init__.py, backend.py, and any engine-specific files.
2. Add engine registration and logic to backend/services/tts_backend.py.
3. Update backend/services/settings_store.py if engine requires settings or license gating.
4. Update or create frontend/src/components/EngineCompatibilityMatrix.jsx and related frontend/src/api/types.ts to surface the new engine.
5. Update backend/api/routers/engines.py to expose health/status endpoints if needed.
6. Add tests for the new engine in tests/test_{engine_name}.py and/or tests/backend/services/test_{engine_name}_sidecar.py.
7. Update .github/workflows/ci.yml to ensure CI builds/tests the new engine.
8. Document engine in .planning/phases/{phase}/ and/or docs/engines/{engine_name}.md.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: backend/engines/{engine_name}/__init__.py, backend/engines/{engine_name}/backend.py, backend/services/tts_backend.py

